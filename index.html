<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gewicht">
  <meta name="theme-color" content="#000000">
  <title>Gewicht</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    #root { height: 100%; height: 100dvh; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Dependencies -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

const STORAGE_KEY = "weight-tracker-v3";
const GOAL_DATE = new Date("2026-06-29");

function getDaysBetween(a, b) {
  return Math.round((b - a) / (1000 * 60 * 60 * 24));
}

function getMovingAverage(entries, days = 7) {
  const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
  return sorted.map((entry, i) => {
    const windowStart = Math.max(0, i - days + 1);
    const window = sorted.slice(windowStart, i + 1);
    const avg = window.reduce((sum, e) => sum + e.weight, 0) / window.length;
    return { ...entry, avg: parseFloat(avg.toFixed(2)) };
  });
}

function getWeeklyRate(entries) {
  if (entries.length < 7) return null;
  const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
  const averaged = getMovingAverage(sorted, 7);
  if (averaged.length < 8) return null;
  const recent = averaged[averaged.length - 1].avg;
  const weekAgo = averaged[averaged.length - 8]?.avg;
  if (!weekAgo) return null;
  return parseFloat((recent - weekAgo).toFixed(2));
}

function getInsights(entries, goalWeight) {
  if (entries.length < 3) return null;
  const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
  const averaged = getMovingAverage(sorted, 7);
  const currentAvg = averaged[averaged.length - 1].avg;
  const today = new Date();
  const daysToGoal = getDaysBetween(today, GOAL_DATE);
  const weeklyRate = getWeeklyRate(entries);
  const weightNeeded = goalWeight ? goalWeight - currentAvg : null;
  const rateNeeded = (goalWeight && daysToGoal > 0) ? (weightNeeded / daysToGoal * 7) : null;

  let advice = null;
  let adviceType = "neutral";

  if (goalWeight && weeklyRate !== null && rateNeeded !== null) {
    if (weeklyRate >= rateNeeded * 0.85) {
      advice = "Je ligt perfect op schema. Houd dit tempo aan.";
      adviceType = "good";
    } else if (weeklyRate >= rateNeeded * 0.5) {
      advice = `Iets te langzaam. Probeer ${(rateNeeded - weeklyRate).toFixed(2)} kg/week extra bij te komen.`;
      adviceType = "warn";
    } else if (weeklyRate !== null && weeklyRate < 0) {
      advice = "Je valt af. Verhoog je calorie-inname om bij te komen.";
      adviceType = "bad";
    } else {
      advice = "Te langzaam. Je hebt significant meer calorieën nodig.";
      adviceType = "bad";
    }
  }

  return { currentAvg, weeklyRate, weightNeeded, rateNeeded, daysToGoal, advice, adviceType };
}

const CustomTooltip = ({ active, payload }) => {
  if (active && payload && payload.length) {
    return (
      <div style={{
        background: "rgba(44,44,46,0.98)",
        backdropFilter: "blur(20px)",
        border: "1px solid rgba(255,255,255,0.06)",
        borderRadius: 10,
        padding: "8px 12px",
      }}>
        <p style={{ color: "rgba(255,255,255,0.4)", fontSize: 11, margin: "0 0 4px" }}>{payload[0]?.payload?.date}</p>
        {payload.find(p => p.dataKey === "weight") && (
          <p style={{ color: "rgba(255,255,255,0.55)", fontSize: 12, margin: "0 0 2px" }}>
            Meting: <span style={{ color: "#fff", fontWeight: 600 }}>{payload.find(p => p.dataKey === "weight")?.value} kg</span>
          </p>
        )}
        {payload.find(p => p.dataKey === "avg") && (
          <p style={{ color: "rgba(10,132,255,0.7)", fontSize: 12, margin: 0 }}>
            Gem: <span style={{ color: "#0a84ff", fontWeight: 600 }}>{payload.find(p => p.dataKey === "avg")?.value} kg</span>
          </p>
        )}
      </div>
    );
  }
  return null;
};

function StatCard({ label, value, sub, color = "#fff", span = 1 }) {
  return (
    <div style={{
      background: "#1c1c1e",
      borderRadius: 14,
      padding: "16px",
      gridColumn: span === 2 ? "1 / -1" : "auto",
    }}>
      <div style={{ fontSize: 12, color: "#636366", fontWeight: 500, marginBottom: 8, letterSpacing: 0.1 }}>{label}</div>
      <div style={{ fontSize: 24, fontWeight: 700, color, letterSpacing: -0.5, lineHeight: 1 }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: "#48484a", marginTop: 5 }}>{sub}</div>}
    </div>
  );
}

function WeightTracker() {
  const [entries, setEntries] = useState([]);
  const [inputWeight, setInputWeight] = useState("");
  const [goalWeight, setGoalWeight] = useState("");
  const [goalInput, setGoalInput] = useState("");
  const [activeTab, setActiveTab] = useState("today");
  const [saved, setSaved] = useState(false);
  const [goalSaved, setGoalSaved] = useState(false);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        setEntries(data.entries || []);
        setGoalWeight(data.goalWeight || "");
        setGoalInput(data.goalWeight ? String(data.goalWeight) : "");
      }
    } catch {}
    setLoaded(true);
  }, []);

  function persist(newEntries, newGoal) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ entries: newEntries, goalWeight: newGoal }));
    } catch {}
  }

  function saveEntry() {
    const w = parseFloat(inputWeight);
    if (!w || w < 30 || w > 300) return;
    const today = new Date().toISOString().split("T")[0];
    const updated = [...entries.filter(e => e.date !== today), { date: today, weight: w }];
    setEntries(updated);
    persist(updated, goalWeight);
    setSaved(true);
    setInputWeight("");
    setTimeout(() => setSaved(false), 2000);
  }

  function saveGoal() {
    const g = parseFloat(goalInput);
    if (!g || g < 30 || g > 300) return;
    setGoalWeight(g);
    persist(entries, g);
    setGoalSaved(true);
    setTimeout(() => setGoalSaved(false), 2000);
  }

  function deleteEntry(date) {
    const updated = entries.filter(e => e.date !== date);
    setEntries(updated);
    persist(updated, goalWeight);
  }

  const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
  const averaged = getMovingAverage(sorted, 7);
  const chartData = averaged.map(e => ({
    date: new Date(e.date).toLocaleDateString("nl-NL", { day: "numeric", month: "short" }),
    weight: e.weight,
    avg: e.avg,
  }));

  const insights = getInsights(entries, goalWeight || null);
  const weeklyRate = getWeeklyRate(entries);
  const todayStr = new Date().toISOString().split("T")[0];
  const todayLogged = entries.find(e => e.date === todayStr);
  const adviceColor = { good: "#30d158", warn: "#ff9f0a", bad: "#ff453a", neutral: "#636366" };

  const tabs = [
    { key: "today", label: "Vandaag" },
    { key: "graph",   label: "Grafiek"  },
    { key: "history", label: "Historie" },
    { key: "settings",label: "Doel"     },
  ];

  if (!loaded) return (
    <div style={{ height: "100dvh", background: "#000", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: "#636366", fontSize: 14, fontFamily: "-apple-system, sans-serif" }}>Laden…</div>
    </div>
  );

  return (
    <div style={{
      height: "100dvh",
      background: "#000",
      color: "#fff",
      fontFamily: "-apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif",
      display: "flex",
      flexDirection: "column",
      maxWidth: 390,
      margin: "0 auto",
      overflow: "hidden",
    }}>
      {/* Status bar safe area */}
      <div style={{ paddingTop: "env(safe-area-inset-top, 14px)" }} />

      {/* Header */}
      <div style={{ padding: "8px 24px 0" }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#636366", letterSpacing: 0.5, marginBottom: 2 }}>ROAD TO JUNE 29</div>
        <div style={{ fontSize: 30, fontWeight: 700, letterSpacing: -0.8, lineHeight: 1.1 }}>Gewicht</div>
      </div>

      {/* Scrollable content */}
      <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 8px", WebkitOverflowScrolling: "touch" }}>

        {/* TODAY */}
        {activeTab === "today" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ background: "#1c1c1e", borderRadius: 16, overflow: "hidden" }}>
              <div style={{ padding: "14px 16px 10px" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#8e8e93", marginBottom: 12 }}>
                  {todayLogged ? `Vandaag: ${todayLogged.weight} kg` : "Log gewicht van vandaag"}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ position: "relative", flex: 1 }}>
                    <input
                      type="number"
                      step="0.1"
                      placeholder="0.0"
                      value={inputWeight}
                      onChange={e => setInputWeight(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveEntry()}
                      style={{
                        width: "100%",
                        background: "#2c2c2e",
                        border: "none",
                        borderRadius: 10,
                        color: "#fff",
                        padding: "12px 42px 12px 14px",
                        fontSize: 17,
                        fontFamily: "inherit",
                        outline: "none",
                        boxSizing: "border-box",
                        WebkitAppearance: "none",
                      }}
                    />
                    <span style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", color: "#48484a", fontSize: 15, fontWeight: 500, pointerEvents: "none" }}>kg</span>
                  </div>
                  <button onClick={saveEntry} style={{
                    background: saved ? "#30d158" : "#0a84ff",
                    border: "none",
                    borderRadius: 10,
                    color: "#fff",
                    padding: "12px 18px",
                    fontSize: 15,
                    fontWeight: 600,
                    cursor: "pointer",
                    fontFamily: "inherit",
                    transition: "background 0.25s",
                    flexShrink: 0,
                    minWidth: 90,
                  }}>
                    {saved ? "✓ Klaar" : "Opslaan"}
                  </button>
                </div>
              </div>
            </div>

            {insights?.advice && (
              <div style={{
                background: `${adviceColor[insights.adviceType]}14`,
                border: `1px solid ${adviceColor[insights.adviceType]}30`,
                borderRadius: 14,
                padding: "13px 15px",
                display: "flex",
                gap: 11,
                alignItems: "flex-start",
              }}>
                <div style={{ fontSize: 16, lineHeight: 1.4 }}>
                  {insights.adviceType === "good" ? "✅" : insights.adviceType === "warn" ? "⚠️" : "🔴"}
                </div>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: adviceColor[insights.adviceType], marginBottom: 3 }}>
                    {insights.adviceType === "good" ? "Op schema" : insights.adviceType === "warn" ? "Bijsturen nodig" : "Actie vereist"}
                  </div>
                  <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", lineHeight: 1.45 }}>{insights.advice}</div>
                </div>
              </div>
            )}

            {insights ? (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <StatCard label="7-daags gemiddelde" value={`${insights.currentAvg} kg`} sub="gefilterd voor fluctuaties" color="#0a84ff" />
                <StatCard
                  label="Tempo per week"
                  value={weeklyRate !== null ? `${weeklyRate >= 0 ? "+" : ""}${weeklyRate} kg` : "— kg"}
                  sub={weeklyRate !== null ? "bijgekomen" : "7+ dagen nodig"}
                  color={weeklyRate === null ? "#636366" : weeklyRate > 0 ? "#30d158" : "#ff453a"}
                />
                {goalWeight ? (
                  <StatCard label="Nog nodig" value={`${(goalWeight - insights.currentAvg).toFixed(1)} kg`} sub={`naar ${goalWeight} kg`} color="#ff9f0a" />
                ) : null}
                <StatCard label="Dagen over" value={`${insights.daysToGoal}`} sub="tot June 29" color="#bf5af2" />
                {goalWeight && insights.rateNeeded ? (
                  <StatCard label="Vereist tempo" value={`+${insights.rateNeeded.toFixed(2)} kg`} sub="per week nodig" color="#ff9f0a" />
                ) : null}
              </div>
            ) : (
              <div style={{ background: "#1c1c1e", borderRadius: 16, padding: "32px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>📊</div>
                <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Nog te weinig data</div>
                <div style={{ fontSize: 13, color: "#8e8e93", lineHeight: 1.5 }}>
                  Log minstens 3 dagen voor inzichten. Het 7-daags gemiddelde filtert dagelijkse schommelingen eruit.
                </div>
              </div>
            )}

            <div style={{ background: "#1c1c1e", borderRadius: 14, padding: "13px 15px" }}>
              <div style={{ fontSize: 13, color: "#8e8e93", lineHeight: 1.55 }}>
                <span style={{ fontSize: 14 }}>💡</span>{" "}
                <strong style={{ color: "rgba(255,255,255,0.75)" }}>Tip:</strong> Weeg elke ochtend na het toilet, voor het eten. Zelfde moment = betrouwbare data.
              </div>
            </div>
          </div>
        )}

        {/* GRAPH */}
        {activeTab === "graph" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {chartData.length >= 2 ? (
              <>
                <div style={{ background: "#1c1c1e", borderRadius: 16, padding: "18px 8px 14px" }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#8e8e93", paddingLeft: 12, marginBottom: 16 }}>Gewicht & 7-daags gemiddelde</div>
                  <ResponsiveContainer width="100%" height={180}>
                    <LineChart data={chartData} margin={{ top: 4, right: 14, left: -16, bottom: 4 }}>
                      <XAxis dataKey="date" tick={{ fill: "#48484a", fontSize: 10 }} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                      <YAxis tick={{ fill: "#48484a", fontSize: 10 }} axisLine={false} tickLine={false} domain={["auto", "auto"]} />
                      <Tooltip content={<CustomTooltip />} />
                      {goalWeight && <ReferenceLine y={goalWeight} stroke="#ff9f0a44" strokeDasharray="4 4" />}
                      <Line type="monotone" dataKey="weight" stroke="rgba(255,255,255,0.12)" strokeWidth={1.5} dot={{ fill: "rgba(255,255,255,0.2)", r: 2.5, strokeWidth: 0 }} activeDot={false} />
                      <Line type="monotone" dataKey="avg" stroke="#0a84ff" strokeWidth={2.5} dot={false} activeDot={{ fill: "#0a84ff", r: 4, strokeWidth: 2, stroke: "#000" }} />
                    </LineChart>
                  </ResponsiveContainer>
                  <div style={{ display: "flex", gap: 16, paddingLeft: 14, marginTop: 10 }}>
                    {[
                      { color: "#0a84ff", dash: false, label: "Gemiddelde" },
                      { color: "rgba(255,255,255,0.2)", dash: false, label: "Dagmeting" },
                      goalWeight ? { color: "#ff9f0a66", dash: true, label: `Doel ${goalWeight}kg` } : null,
                    ].filter(Boolean).map((item, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                        <div style={{ width: 18, height: 2, background: item.dash ? "transparent" : item.color, borderTop: item.dash ? `2px dashed ${item.color}` : "none", borderRadius: 1 }} />
                        <span style={{ fontSize: 11, color: "#636366" }}>{item.label}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {sorted.length >= 3 && (
                  <div style={{ background: "#1c1c1e", borderRadius: 16, overflow: "hidden" }}>
                    <div style={{ padding: "14px 16px 0", fontSize: 13, fontWeight: 600, color: "#8e8e93" }}>Recente metingen</div>
                    {[...sorted].slice(-7).reverse().map((entry, i, arr) => {
                      const idx = sorted.findIndex(e => e.date === entry.date);
                      const prev = idx > 0 ? sorted[idx - 1] : null;
                      const diff = prev ? (entry.weight - prev.weight) : null;
                      return (
                        <div key={entry.date} style={{
                          display: "flex",
                          justifyContent: "space-between",
                          alignItems: "center",
                          padding: "12px 16px",
                          borderBottom: i < arr.length - 1 ? "1px solid #2c2c2e" : "none",
                        }}>
                          <div style={{ fontSize: 14, color: "#8e8e93" }}>
                            {new Date(entry.date).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" })}
                          </div>
                          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                            {diff !== null && (
                              <div style={{ fontSize: 12, color: diff >= 0 ? "#30d158" : "#ff453a", fontWeight: 500 }}>
                                {diff >= 0 ? "+" : ""}{diff.toFixed(1)}
                              </div>
                            )}
                            <div style={{ fontSize: 15, fontWeight: 600 }}>{entry.weight} kg</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </>
            ) : (
              <div style={{ background: "#1c1c1e", borderRadius: 16, padding: "40px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>📈</div>
                <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Nog geen grafiek</div>
                <div style={{ fontSize: 13, color: "#8e8e93" }}>Log minstens 2 dagen om de grafiek te zien.</div>
              </div>
            )}
          </div>
        )}

        {/* HISTORY */}
        {activeTab === "history" && (
          <div>
            {sorted.length === 0 ? (
              <div style={{ background: "#1c1c1e", borderRadius: 16, padding: "40px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>📋</div>
                <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Geen metingen</div>
                <div style={{ fontSize: 13, color: "#8e8e93" }}>Begin via het Vandaag tabblad.</div>
              </div>
            ) : (
              <div style={{ background: "#1c1c1e", borderRadius: 16, overflow: "hidden" }}>
                {[...sorted].reverse().map((entry, i) => {
                  const idx = sorted.findIndex(e => e.date === entry.date);
                  const prev = idx > 0 ? sorted[idx - 1] : null;
                  const diff = prev ? (entry.weight - prev.weight) : null;
                  return (
                    <div key={entry.date} style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      padding: "13px 16px",
                      borderBottom: i < sorted.length - 1 ? "1px solid #2c2c2e" : "none",
                    }}>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 500 }}>
                          {new Date(entry.date).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" })}
                        </div>
                        {diff !== null && (
                          <div style={{ fontSize: 12, color: diff >= 0 ? "#30d158" : "#ff453a", marginTop: 2, fontWeight: 500 }}>
                            {diff >= 0 ? "▲" : "▼"} {Math.abs(diff).toFixed(1)} kg
                          </div>
                        )}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ fontSize: 18, fontWeight: 700 }}>{entry.weight} kg</div>
                        <button onClick={() => deleteEntry(entry.date)} style={{
                          background: "#2c2c2e",
                          border: "none",
                          borderRadius: 8,
                          color: "#ff453a",
                          width: 30,
                          height: 30,
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          fontSize: 14,
                          cursor: "pointer",
                          fontFamily: "inherit",
                          flexShrink: 0,
                        }}>✕</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* SETTINGS */}
        {activeTab === "settings" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ background: "#1c1c1e", borderRadius: 16, padding: 18 }}>
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>Doelgewicht</div>
              <div style={{ fontSize: 13, color: "#8e8e93", marginBottom: 16, lineHeight: 1.5 }}>
                Stel je doelgewicht in. De app berekent welk wekelijks tempo je nodig hebt voor June 29.
              </div>
              <div style={{ position: "relative", marginBottom: 10 }}>
                <input
                  type="number"
                  step="0.5"
                  placeholder={goalWeight ? String(goalWeight) : "75.0"}
                  value={goalInput}
                  onChange={e => setGoalInput(e.target.value)}
                  style={{
                    width: "100%",
                    background: "#2c2c2e",
                    border: "none",
                    borderRadius: 10,
                    color: "#fff",
                    padding: "13px 46px 13px 14px",
                    fontSize: 17,
                    fontFamily: "inherit",
                    outline: "none",
                    boxSizing: "border-box",
                    WebkitAppearance: "none",
                  }}
                />
                <span style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", color: "#48484a", fontSize: 15, fontWeight: 500, pointerEvents: "none" }}>kg</span>
              </div>
              <button onClick={saveGoal} style={{
                width: "100%",
                background: goalSaved ? "#30d158" : "#0a84ff",
                border: "none",
                borderRadius: 10,
                color: "#fff",
                padding: "13px",
                fontSize: 15,
                fontWeight: 600,
                cursor: "pointer",
                fontFamily: "inherit",
                transition: "background 0.25s",
              }}>
                {goalSaved ? "✓ Opgeslagen" : "Stel doel in"}
              </button>
              {goalWeight && (
                <div style={{ marginTop: 10, fontSize: 13, color: "#636366", textAlign: "center" }}>
                  Huidig doel: <span style={{ color: "#ff9f0a", fontWeight: 600 }}>{goalWeight} kg</span>
                </div>
              )}
            </div>

            <div style={{ background: "#1c1c1e", borderRadius: 16, overflow: "hidden" }}>
              {[
                { icon: "📏", title: "Dagelijks wegen", desc: "Elke ochtend na het toilet, voor het eten. Consistente omstandigheden = betrouwbare data." },
                { icon: "📊", title: "7-daags gemiddelde", desc: "Dagelijkse schommelingen door water en eten worden eruit gefilterd. Alleen de echte trend blijft over." },
                { icon: "📈", title: "Wekelijks tempo", desc: "Na 7+ metingen zie je hoeveel je per week bijkomt — vergeleken met wat je nodig hebt." },
                { icon: "🎯", title: "Bijsturing", desc: "De app vertelt je precies of je op schema ligt of moet bijsturen." },
              ].map((item, i) => (
                <div key={i} style={{
                  display: "flex",
                  gap: 14,
                  padding: "14px 16px",
                  borderBottom: i < 3 ? "1px solid #2c2c2e" : "none",
                }}>
                  <div style={{ fontSize: 20, lineHeight: 1.4 }}>{item.icon}</div>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 3 }}>{item.title}</div>
                    <div style={{ fontSize: 13, color: "#8e8e93", lineHeight: 1.5 }}>{item.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Bottom tab bar */}
      <div style={{
        background: "rgba(28,28,30,0.92)",
        backdropFilter: "blur(20px)",
        WebkitBackdropFilter: "blur(20px)",
        borderTop: "1px solid rgba(255,255,255,0.06)",
        paddingTop: 10,
        paddingBottom: "calc(16px + env(safe-area-inset-bottom, 0px))",
        display: "flex",
        flexShrink: 0,
      }}>
        {tabs.map(tab => (
          <button key={tab.key} onClick={() => setActiveTab(tab.key)} style={{
            flex: 1,
            background: "none",
            border: "none",
            cursor: "pointer",
            padding: "4px 0",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: 3,
            fontFamily: "inherit",
          }}>
            <div style={{ fontSize: 22, opacity: activeTab === tab.key ? 1 : 0.35, transition: "opacity 0.2s" }}>
              {tab.key === "today" ? "⊙" : tab.key === "graph" ? "📈" : tab.key === "history" ? "📋" : "🎯"}
            </div>
            <div style={{
              fontSize: 10,
              fontWeight: activeTab === tab.key ? 600 : 400,
              color: activeTab === tab.key ? "#0a84ff" : "#636366",
              transition: "color 0.2s",
            }}>
              {tab.label}
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<WeightTracker />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
